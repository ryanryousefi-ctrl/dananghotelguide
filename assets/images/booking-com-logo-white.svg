<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 40" width="200" height="40" role="img" aria-label="Booking.com">
  <!-- Blue square "B" block -->
  <rect x="2" y="4" width="32" height="32" rx="5" fill="rgba(255,255,255,0.22)"/>
  <text x="8" y="28" font-family="'Arial Black','Arial Bold',Arial,Helvetica,sans-serif" font-size="24" font-weight="900" fill="#ffffff" letter-spacing="-1">B</text>
  <!-- "ooking" immediately after B block -->
  <text x="40" y="28" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#ffffff" letter-spacing="0">ooking</text>
  <!-- ".com" in slightly lighter white -->
  <text x="127" y="28" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="rgba(255,255,255,0.85)" letter-spacing="0">.com</text>
</svg>
