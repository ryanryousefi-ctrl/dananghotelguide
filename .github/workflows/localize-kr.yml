name: Korean Localization

# Least privilege: nothing by default; only the job below may write contents.
permissions: {}

on:
  workflow_dispatch:

jobs:
  localize:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Actions pinned to full commit SHAs (v4 at time of pinning).
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      # Exact versions from package-lock.json; no dev packages, no install scripts.
      - name: Install dependencies
        run: npm ci --omit=dev --ignore-scripts

      - name: Run localization
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node localize-kr.js --all

      - name: Commit Korean pages
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add kr/
          git commit -m "Add Korean translations" || echo "No changes"
          git push
